<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <title>MagazynScan — Telefon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    #reader video { border-radius: 0.75rem; object-fit: cover; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col">

  <!-- GÓRNY PASEK -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 px-4 h-14 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-bold text-sm">
        📱
      </div>
      <div>
        <h1 class="font-bold text-sm leading-tight">MagazynScan Mobile</h1>
        <p id="sync-status" class="text-[10px] text-slate-400">Tryb lokalny</p>
      </div>
    </div>
    <a href="desktop.html" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-lg border border-slate-700">
      🖥️ Przejdź do PC
    </a>
  </header>

  <!-- TREŚĆ GŁÓWNA -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-4">
    
    <!-- SKANER -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 shadow-xl">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-semibold text-emerald-400 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          Skaner Kamery
        </span>
        <div class="flex gap-1.5">
          <button onclick="startScanner()" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-lg">Uruchom</button>
          <button onclick="stopScanner()" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-lg">Stop</button>
        </div>
      </div>
      <div id="reader" class="w-full overflow-hidden rounded-xl bg-slate-950 min-h-[200px] flex items-center justify-center border border-slate-800">
        <p class="text-xs text-slate-500 text-center px-4">Kliknij „Uruchom”, aby włączyć aparat w telefonie.</p>
      </div>
      <div class="mt-2.5 flex items-center justify-between">
        <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-center py-1.5 px-3 rounded-lg text-xs font-medium text-slate-300 border border-slate-700 w-full">
          📷 Skanuj ze zdjęcia / galerii
          <input type="file" accept="image/*" capture="environment" onchange="scanFromFile(event)" class="hidden" />
        </label>
      </div>
    </div>

    <!-- FORMULARZ OPERACJI -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 shadow-xl">
      <div>
        <label class="block text-[11px] font-medium text-slate-400 mb-1">Aktualna Lokalizacja / Regał</label>
        <div class="flex gap-2">
          <input id="mob-location" type="text" placeholder="np. R-01-A (lub zeskanuj LOC:...)" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs focus:border-emerald-500 focus:outline-none" />
          <button onclick="document.getElementById('mob-location').value=''" class="px-2.5 bg-slate-800 rounded-lg text-[10px] text-slate-400">Wyczyść</button>
        </div>
      </div>

      <div>
        <label class="block text-[11px] font-medium text-slate-400 mb-1">Kod Towaru / SKU / EAN</label>
        <input id="mob-code" type="text" placeholder="Zeskanuj lub wpisz..." oninput="lookupItem(this.value)" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm font-mono text-emerald-300 focus:border-emerald-500 focus:outline-none" />
      </div>

      <div>
        <label class="block text-[11px] font-medium text-slate-400 mb-1">Nazwa Towaru</label>
        <input id="mob-name" type="text" placeholder="Nazwa produktu..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs focus:border-emerald-500 focus:outline-none" />
      </div>

      <div class="grid grid-cols-2 gap-3 pt-2">
        <button onclick="processScanAction(1)" class="py-3 bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition rounded-xl font-bold text-xs text-white shadow-lg shadow-emerald-900/30">
          + Przyjmij (+1)
        </button>
        <button onclick="processScanAction(-1)" class="py-3 bg-rose-600 hover:bg-rose-500 active:scale-95 transition rounded-xl font-bold text-xs text-white shadow-lg shadow-rose-900/30">
          - Wydaj (-1)
        </button>
      </div>
    </div>

    <!-- OSTATNIE SKANY -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5">
      <h3 class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-2">Ostatnie operacje</h3>
      <div id="mob-recent-list" class="space-y-2 text-xs"></div>
    </div>
  </main>

  <div id="toast" class="fixed bottom-4 left-4 right-4 z-50 hidden bg-slate-800 border border-slate-700 text-white px-3 py-2.5 rounded-xl shadow-2xl text-center text-xs font-medium"></div>

  <script>
    let inventory = JSON.parse(localStorage.getItem('ms_inventory') || '[]');
    let historyLog = JSON.parse(localStorage.getItem('ms_history') || '[]');
    let html5QrCode = null;
    let isScanning = false;

    window.addEventListener('DOMContentLoaded', () => {
      if (inventory.length === 0) resetDemoData(false);
      renderMobileRecent();
    });

    function playBeep(success = true) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = success ? 'sine' : 'sawtooth';
        osc.frequency.setValueAtTime(success ? 880 : 220, ctx.currentTime);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
        if (navigator.vibrate) navigator.vibrate(success ? 60 : [100, 50, 100]);
      } catch (e) {}
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 2500);
    }

    async function startScanner() {
      if (isScanning) return;
      try {
        html5QrCode = new Html5Qrcode("reader");
        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 12, qrbox: { width: 200, height: 200 } },
          (code) => handleScannedCode(code),
          () => {}
        );
        isScanning = true;
      } catch (err) {
        showToast("Błąd kamery: Wymagane HTTPS i zezwolenie.");
      }
    }

    async function stopScanner() {
      if (html5QrCode && isScanning) {
        try { await html5QrCode.stop(); html5QrCode.clear(); } catch (e) {}
        isScanning = false;
      }
    }

    async function scanFromFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      try {
        const temp = new Html5Qrcode("reader");
        const res = await temp.scanFile(file, true);
        handleScannedCode(res);
      } catch (e) {
        showToast("Nie znalezniono kodu na zdjęciu.");
      }
    }

    let lastTime = 0;
    function handleScannedCode(code) {
      const now = Date.now();
      if (now - lastTime < 1500) return;
      lastTime = now;
      playBeep(true);

      if (code.toUpperCase().startsWith('LOC:')) {
        const loc = code.substring(4).trim();
        document.getElementById('mob-location').value = loc;
        showToast(`📍 Ustawiono regał: ${loc}`);
        return;
      }

      document.getElementById('mob-code').value = code;
      lookupItem(code);
      showToast(`✅ Zeskanowano: ${code}`);
    }

    function lookupItem(code) {
      const found = inventory.find(i => i.code.toLowerCase() === code.trim().toLowerCase());
      if (found) {
        document.getElementById('mob-name').value = found.name;
        if (found.location && !document.getElementById('mob-location').value) {
          document.getElementById('mob-location').value = found.location;
        }
      }
    }

    function processScanAction(delta) {
      const code = document.getElementById('mob-code').value.trim();
      const name = document.getElementById('mob-name').value.trim() || `Towar ${code}`;
      const location = document.getElementById('mob-location').value.trim() || 'Ogólny';

      if (!code) {
        playBeep(false);
        showToast("⚠️ Wpisz lub zeskanuj kod towaru!");
        return;
      }

      const idx = inventory.findIndex(i => i.code.toLowerCase() === code.toLowerCase());
      if (idx >= 0) {
        inventory[idx].qty = Math.max(0, inventory[idx].qty + delta);
        if (name) inventory[idx].name = name;
        if (location) inventory[idx].location = location;
      } else {
        inventory.unshift({ code, name, location, qty: Math.max(0, delta) });
      }

      historyLog.unshift({
        time: new Date().toLocaleTimeString('pl-PL'),
        code, name, location,
        delta: delta > 0 ? `+${delta}` : `${delta}`
      });

      localStorage.setItem('ms_inventory', JSON.stringify(inventory));
      localStorage.setItem('ms_history', JSON.stringify(historyLog.slice(0, 100)));

      playBeep(true);
      showToast(delta > 0 ? `➕ Przyjęto do magazynu` : `➖ Wydano z magazynu`);
      renderMobileRecent();
    }

    function renderMobileRecent() {
      const container = document.getElementById('mob-recent-list');
      if (historyLog.length === 0) {
        container.innerHTML = '<p class="text-slate-500">Brak operacji.</p>';
        return;
      }
      container.innerHTML = historyLog.slice(0, 4).map(h => `
        <div class="flex items-center justify-between bg-slate-950 p-2 rounded-lg border border-slate-800">
          <div>
            <div class="font-semibold text-slate-200">${h.name}</div>
            <div class="text-[10px] text-slate-500 font-mono">${h.code} • Regał: ${h.location}</div>
          </div>
          <span class="font-bold px-1.5 py-0.5 rounded text-[10px] ${h.delta.startsWith('+') ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}">${h.delta}</span>
        </div>
      `).join('');
    }

    function resetDemoData(notify = true) {
      inventory = [
        { code: '5901234567890', name: 'Klocki hamulcowe przód', location: 'R-01-A', qty: 8 },
        { code: 'SKU-FILTR-02', name: 'Filtr oleju silnikowego', location: 'R-01-B', qty: 14 }
      ];
      localStorage.setItem('ms_inventory', JSON.stringify(inventory));
    }
  </script>
</body>
</html>
